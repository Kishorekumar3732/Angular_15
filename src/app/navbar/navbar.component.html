<header class="navbar">

  <div class="navbar-container">

    <!-- =========================================
         BRAND
    ========================================== -->

    <a
      class="brand"
      routerLink="/"
      (click)="closeAllMenus()"
    >

      <div class="brand-icon">
        S
      </div>

      <div class="brand-text">
        <span class="brand-name">ShopEase</span>
        <span class="brand-tagline">
          Shop. Smile. Repeat.
        </span>
      </div>

    </a>


    <!-- =========================================
         DESKTOP MENU
    ========================================== -->

    <nav class="desktop-navigation">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeAllMenus()"
      >
        Home
      </a>


      <!-- CATEGORIES -->

      <div
        class="nav-dropdown"
        (click)="$event.stopPropagation()"
      >

        <button
          type="button"
          class="nav-link dropdown-trigger"
          [class.active]="isCategoryOpen"
          (click)="toggleCategories($event)"
        >

          Categories

          <svg
            class="chevron"
            [class.rotate]="isCategoryOpen"
            viewBox="0 0 24 24"
            fill="none"
          >

            <path
              d="M6 9L12 15L18 9"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        </button>


        <!-- CATEGORY DROPDOWN -->

        <div
          class="dropdown-menu category-menu"
          *ngIf="isCategoryOpen"
        >

          <div class="dropdown-heading">

            <strong>
              Shop by Category
            </strong>

            <span>
              Explore our collections
            </span>

          </div>


          <button
            type="button"
            class="category-item"
            *ngFor="let category of categories"
            (click)="selectCategory(category)"
          >

            <span class="category-icon">

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <circle
                  cx="12"
                  cy="12"
                  r="9"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <path
                  d="M8 12h8"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />

              </svg>

            </span>

            <span class="category-name">
              {{ category }}
            </span>

            <span class="category-arrow">
              →
            </span>

          </button>

        </div>

      </div>


      <!-- PRODUCTS -->

      <a
        routerLink="/products"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeAllMenus()"
      >
        Products
      </a>


      <!-- OFFERS -->

      <a
        routerLink="/products"
        [queryParams]="{ offer: 'true' }"
        class="nav-link offers-link"
        (click)="closeAllMenus()"
      >

        Offers

        <span class="hot-badge">
          HOT
        </span>

      </a>

    </nav>


    <!-- =========================================
         MAIN SEARCH
    ========================================== -->

    <div class="search-wrapper">

      <div class="main-search-box">

        <svg
          class="main-search-icon"
          viewBox="0 0 24 24"
          fill="none"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
          />

          <path
            d="M16.5 16.5L21 21"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />

        </svg>


        <input
          type="text"
          [(ngModel)]="searchText"
          (keyup.enter)="searchProducts()"
          placeholder="Search products, brands and categories..."
          aria-label="Search products"
        />


        <button
          *ngIf="searchText"
          type="button"
          class="clear-search"
          (click)="clearSearch()"
          aria-label="Clear search"
        >
          ×
        </button>


        <button
          type="button"
          class="main-search-button"
          (click)="searchProducts()"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
          >

            <circle
              cx="11"
              cy="11"
              r="6.5"
              stroke="currentColor"
              stroke-width="2"
            />

            <path
              d="M16 16L21 21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

          </svg>

          <span>
            Search
          </span>

        </button>

      </div>

    </div>


    <!-- =========================================
         ACTIONS
    ========================================== -->

    <div class="navbar-actions">

      <!-- WISHLIST -->

      <button
        type="button"
        class="action-button"
        title="Wishlist"
        (click)="navigateTo('/wishlist')"
      >

        <span class="action-icon-wrapper">

          <svg
            viewBox="0 0 24 24"
            fill="none"
          >

            <path
              d="M20.8 8.8C20.8 13.5 12 20 12 20S3.2 13.5 3.2 8.8C3.2 5.7 5.4 4 8 4C9.7 4 11.1 4.9 12 6.1C12.9 4.9 14.3 4 16 4C18.6 4 20.8 5.7 20.8 8.8Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />

          </svg>


          <span
            class="count-badge"
            *ngIf="wishlistCount > 0"
          >
            {{ wishlistCount }}
          </span>

        </span>

        <span class="action-label">
          Wishlist
        </span>

      </button>


      <!-- CART -->

      <button
        type="button"
        class="action-button"
        title="Cart"
        (click)="navigateTo('/cart')"
      >

        <span class="action-icon-wrapper">

          <svg
            viewBox="0 0 24 24"
            fill="none"
          >

            <path
              d="M3 4H5L7.2 15.2C7.4 16.2 8.3 17 9.4 17H17.5C18.5 17 19.4 16.3 19.7 15.4L21 9H6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <circle
              cx="10"
              cy="20"
              r="1.3"
              fill="currentColor"
            />

            <circle
              cx="17"
              cy="20"
              r="1.3"
              fill="currentColor"
            />

          </svg>


          <span
            class="count-badge"
            *ngIf="cartCount > 0"
          >
            {{ cartCount }}
          </span>

        </span>

        <span class="action-label">
          Cart
        </span>

      </button>


      <!-- ACCOUNT -->

      <div
        class="account-wrapper"
        (click)="$event.stopPropagation()"
      >

        <button
          type="button"
          class="account-button"
          [class.active]="isAccountOpen"
          (click)="toggleAccount($event)"
        >

          <span class="account-icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
            >

              <circle
                cx="12"
                cy="8"
                r="3.5"
                stroke="currentColor"
                stroke-width="1.8"
              />

              <path
                d="M5 20C5.7 16.8 8.2 15 12 15C15.8 15 18.3 16.8 19 20"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />

            </svg>

          </span>


          <span class="account-text">

            <small>
              Hello,
            </small>

            <strong>
              Account
            </strong>

          </span>


          <svg
            class="account-chevron"
            [class.rotate]="isAccountOpen"
            viewBox="0 0 24 24"
            fill="none"
          >

            <path
              d="M6 9L12 15L18 9"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        </button>


        <!-- ACCOUNT DROPDOWN -->

        <div
          class="dropdown-menu account-menu"
          *ngIf="isAccountOpen"
        >

          <div class="account-header">

            <div class="account-avatar">
              A
            </div>

            <div>

              <strong>
                Welcome to ShopEase
              </strong>

              <span>
                Manage your account
              </span>

            </div>

          </div>


          <button
            type="button"
            (click)="navigateTo('/login')"
          >
            <span>Sign In</span>
            <span>→</span>
          </button>


          <button
            type="button"
            (click)="navigateTo('/profile')"
          >
            <span>My Profile</span>
            <span>→</span>
          </button>


          <button
            type="button"
            (click)="navigateTo('/orders')"
          >
            <span>My Orders</span>
            <span>→</span>
          </button>

        </div>

      </div>

    </div>


    <!-- =========================================
         MOBILE MENU BUTTON
    ========================================== -->

    <button
      type="button"
      class="mobile-menu-button"
      [class.open]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
      aria-label="Open navigation menu"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>


  <!-- =========================================
       MOBILE NAVIGATION
  ========================================== -->

  <div
    class="mobile-navigation"
    [class.open]="isMobileMenuOpen"
  >

    <!-- MOBILE SEARCH -->

    <div class="mobile-search">

      <div class="mobile-search-box">

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
          />

          <path
            d="M16.5 16.5L21 21"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />

        </svg>


        <input
          type="text"
          [(ngModel)]="searchText"
          (keyup.enter)="searchProducts()"
          placeholder="Search products..."
        />


        <button
          type="button"
          (click)="searchProducts()"
        >
          Search
        </button>

      </div>

    </div>


    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMobileMenu()"
    >
      Home
    </a>


    <button
      type="button"
      class="mobile-category-button"
      (click)="toggleCategories($event)"
    >

      <span>
        Categories
      </span>

      <span
        [class.rotate]="isCategoryOpen"
      >
        ↓
      </span>

    </button>


    <div
      class="mobile-categories"
      *ngIf="isCategoryOpen"
    >

      <button
        type="button"
        *ngFor="let category of categories"
        (click)="selectCategory(category)"
      >
        {{ category }}
      </button>

    </div>


    <a
      routerLink="/products"
      (click)="closeMobileMenu()"
    >
      Products
    </a>


    <a
      routerLink="/products"
      [queryParams]="{ offer: 'true' }"
      (click)="closeMobileMenu()"
    >
      Offers
    </a>


    <a
      routerLink="/wishlist"
      (click)="closeMobileMenu()"
    >

      Wishlist

      <span class="mobile-count">
        {{ wishlistCount }}
      </span>

    </a>


    <a
      routerLink="/cart"
      (click)="closeMobileMenu()"
    >

      Cart

      <span class="mobile-count">
        {{ cartCount }}
      </span>

    </a>


    <a
      routerLink="/login"
      (click)="closeMobileMenu()"
    >
      Account
    </a>

  </div>

</header>
